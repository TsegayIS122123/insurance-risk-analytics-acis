name: Insurance Analytics CI

on: [push, pull_request]

jobs:
  insurance-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install core dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Verify task-specific packages
      run: |
        echo " Verifying packages for all 4 tasks:"
        echo "======================================="
        python -c "import pandas; print('Task 1  EDA: pandas')"
        python -c "import dvc; print('Task 2  DVC: dvc')"
        python -c "import scipy; print('Task 3 Stats: scipy')"
        python -c "import sklearn; print('Task 4  ML: sklearn')"
        echo " All task dependencies verified!"